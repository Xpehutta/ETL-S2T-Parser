<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Excel Parser + S2T Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding-top: 2rem; }
        .card { margin-top: 2rem; }
        pre { background: #f4f4f4; padding: 0.5rem; border-radius: 0.25rem; overflow-x: auto; }
        .alert-success { margin-top: 1rem; }
        .chat-container {
            background: #f8f9fc;
            border: 1px solid #dee2e6;
            border-radius: 0.5rem;
            padding: 1rem;
            margin-top: 1rem;
            max-height: 400px;
            overflow-y: auto;
        }
        .chat-message {
            margin-bottom: 0.75rem;
            padding: 0.5rem;
            border-radius: 0.5rem;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .chat-user {
            background: #e9ecef;
            text-align: right;
        }
        .chat-agent {
            background: #d1e7dd;
            text-align: left;
        }
        .chat-input-group {
            margin-top: 1rem;
        }
        .typing-indicator {
            font-style: italic;
            color: #6c757d;
            padding: 0.5rem;
        }
        .summary-box {
            font-size: 0.95rem;
            line-height: 1.55;
            max-height: 420px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .transformations-table {
            font-size: 0.82rem;
            background: #fff;
            min-width: 900px;
            table-layout: fixed;
        }
        .transformations-table th {
            white-space: nowrap;
        }
        .transformations-table td {
            vertical-align: top;
            max-width: 260px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .transformations-sql {
            max-width: 360px;
            white-space: pre-wrap;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 0.78rem;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-10">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">🤖 AI Excel Parser + S2T Chat</h4>
                </div>
                <div class="card-body">
                    <!-- File upload area (unchanged) -->
                    <form id="uploadForm" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="fileInput" class="form-label">Choose Excel file (.xlsx, .xls, .xlsm)</label>
                            <input class="form-control" type="file" id="fileInput" name="file" accept=".xlsx,.xls,.xlsm" required>
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="includeHiddenRows">
                            <label class="form-check-label" for="includeHiddenRows">Учитывать скрытые строки</label>
                        </div>
                        <button type="submit" class="btn btn-primary">Upload & Analyze</button>
                        <button type="button" id="resetBtn" class="btn btn-secondary">🔄 New File</button>
                        <button type="button" id="toggleChatBtn" class="btn btn-info">💬 Show Chat</button>
                        <a href="/chat_app" class="btn btn-outline-dark">Chat-first app</a>
                        <div id="loading" class="mt-3 text-primary d-none">🤔 AI is analyzing the workbook... ⏳</div>
                    </form>

                    <!-- Business summary (summarizer agent) -->
                    <div id="summaryArea" class="mt-4" style="display: none;">
                        <div class="card border-success shadow-sm">
                            <div class="card-header bg-success bg-opacity-10 py-2">
                                <strong>📋 Business summary</strong>
                                <span class="text-muted small ms-1">(summarizer agent, Russian)</span>
                            </div>
                            <div class="card-body py-3">
                                <div id="summaryContent" class="summary-box text-body"></div>
                            </div>
                        </div>
                    </div>

                    <!-- S2T transformations browser -->
                    <div id="transformationsArea" class="mt-4" style="display: none;">
                        <div class="card border-primary shadow-sm">
                            <div class="card-header bg-primary bg-opacity-10 py-2 d-flex justify-content-between align-items-center">
                                <div>
                                    <strong>S2T transformations</strong>
                                    <span id="transformationsCount" class="text-muted small ms-1"></span>
                                </div>
                                <div class="btn-group btn-group-sm" role="group">
                                    <button type="button" id="loadTransformationsBtn" class="btn btn-outline-primary">Load</button>
                                    <button type="button" id="clearAllDataBtn" class="btn btn-outline-danger">Clear all data</button>
                                </div>
                            </div>
                            <div class="card-body py-3">
                                <div class="input-group input-group-sm mb-2">
                                    <input type="text" id="transformationsSearch" class="form-control" placeholder="Filter by target/source/table/rule">
                                    <button type="button" id="searchTransformationsBtn" class="btn btn-outline-secondary">Search</button>
                                </div>
                                <div id="transformationsContent" class="text-muted small">
                                    Transformations are loaded from SQLite table <code>s2t_transformations</code>.
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Error area (unchanged) -->
                    <div id="errorArea" class="mt-4 text-danger" style="display: none;">
                        <strong>Error:</strong> <span id="errorMessage"></span>
                    </div>

                    <!-- NEW: Chat area (initially hidden) -->
                    <div id="chatArea" class="mt-4" style="display: none;">
                        <h5>💬 Ask the AI Agent about your data</h5>
                        <div id="chatMessages" class="chat-container"></div>
                        <div class="chat-input-group input-group">
                            <input type="text" id="chatInput" class="form-control" placeholder="e.g., Show lineage of customer_email, Find columns similar to revenue, Which files contain customer data?">
                            <button id="sendChatBtn" class="btn btn-primary">Send</button>
                        </div>
                        <div id="chatTyping" class="typing-indicator" style="display: none;">Agent is thinking...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let currentFileId = null;

    const form = document.getElementById('uploadForm');
    const fileInput = document.getElementById('fileInput');
    const includeHiddenRows = document.getElementById('includeHiddenRows');
    const loadingDiv = document.getElementById('loading');
    const errorArea = document.getElementById('errorArea');
    const errorMessage = document.getElementById('errorMessage');
    const resetBtn = document.getElementById('resetBtn');
    const toggleChatBtn = document.getElementById('toggleChatBtn');
    const chatArea = document.getElementById('chatArea');
    const chatMessages = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');
    const sendChatBtn = document.getElementById('sendChatBtn');
    const chatTyping = document.getElementById('chatTyping');
    const summaryArea = document.getElementById('summaryArea');
    const summaryContent = document.getElementById('summaryContent');
    const transformationsArea = document.getElementById('transformationsArea');
    const transformationsCount = document.getElementById('transformationsCount');
    const transformationsContent = document.getElementById('transformationsContent');
    const transformationsSearch = document.getElementById('transformationsSearch');
    const loadTransformationsBtn = document.getElementById('loadTransformationsBtn');
    const clearAllDataBtn = document.getElementById('clearAllDataBtn');
    const searchTransformationsBtn = document.getElementById('searchTransformationsBtn');

    // Reset UI but keep the selected file (used before upload)
    function resetUI() {
        errorArea.style.display = 'none';
        errorMessage.textContent = '';
        currentFileId = null;
        summaryArea.style.display = 'none';
        summaryContent.textContent = '';
        transformationsArea.style.display = 'none';
        transformationsCount.textContent = '';
        transformationsContent.innerHTML = 'Transformations are loaded from SQLite table <code>s2t_transformations</code>.';
        transformationsSearch.value = '';
    }

    // Full reset including file input (used by New File button)
    function fullReset() {
        resetUI();
        fileInput.value = '';
        // Also clear chat history if open
        if (chatArea.style.display !== 'none') {
            chatMessages.innerHTML = '';
        }
    }

    resetBtn.addEventListener('click', fullReset);

    // Toggle chat visibility
    toggleChatBtn.addEventListener('click', () => {
        if (chatArea.style.display === 'none') {
            chatArea.style.display = 'block';
            toggleChatBtn.textContent = '💬 Hide Chat';
        } else {
            chatArea.style.display = 'none';
            toggleChatBtn.textContent = '💬 Show Chat';
        }
    });

    // Chat functionality
    async function sendChatMessage() {
        const query = chatInput.value.trim();
        if (!query) return;
        // Add user message to chat
        addChatMessage('user', query);
        chatInput.value = '';
        chatTyping.style.display = 'block';
        sendChatBtn.disabled = true;

        try {
            const response = await fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query: query })
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Chat failed');
            addChatMessage('agent', data.answer);
        } catch (err) {
            addChatMessage('agent', `❌ Error: ${err.message}`);
        } finally {
            chatTyping.style.display = 'none';
            sendChatBtn.disabled = false;
        }
    }

    function addChatMessage(role, text) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `chat-message chat-${role}`;
        messageDiv.innerHTML = `<strong>${role === 'user' ? 'You' : 'Agent'}:</strong><br>${escapeHtml(text)}`;
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    sendChatBtn.addEventListener('click', sendChatMessage);
    chatInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendChatMessage();
    });

    function showSummary(summary, summaryError) {
        summaryArea.style.display = 'block';
        const text = summary === null || summary === undefined ? '' : String(summary).trim();
        if (!text) {
            const detail = summaryError ? `<br><span class="text-danger">${escapeHtml(String(summaryError))}</span>` : '';
            summaryContent.innerHTML = `<p class="text-muted mb-0"><em>No business summary was generated for this file.</em>${detail}</p>`;
            return;
        }
        summaryContent.textContent = summary;
    }

    function showTransformationsPanel(count) {
        const n = Number(count || 0);
        transformationsArea.style.display = 'block';
        transformationsCount.textContent = n ? `(${n} rows)` : '(no rows)';
        if (!n) {
            transformationsContent.innerHTML = '<p class="text-muted mb-0"><em>No S2T transformations were extracted for this file.</em></p>';
            return;
        }
        transformationsContent.innerHTML = '<span class="text-muted">Loading transformations...</span>';
        void loadTransformations();
    }

    async function loadTransformations() {
        if (!currentFileId) return;
        const q = transformationsSearch.value.trim();
        const params = new URLSearchParams({ limit: '200' });
        if (q) params.set('q', q);
        transformationsContent.innerHTML = '<span class="text-muted">Loading transformations...</span>';
        loadTransformationsBtn.disabled = true;
        clearAllDataBtn.disabled = true;
        searchTransformationsBtn.disabled = true;
        try {
            const response = await fetch(`/transformations/${encodeURIComponent(currentFileId)}?${params.toString()}`);
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Failed to load transformations');
            transformationsCount.textContent = `(${data.total} rows)`;
            transformationsContent.innerHTML = renderTransformationsTable(data.rows, data.total, data.limit);
        } catch (err) {
            transformationsContent.innerHTML = `<div class="alert alert-danger mb-0">Error: ${escapeHtml(err.message)}</div>`;
        } finally {
            loadTransformationsBtn.disabled = false;
            clearAllDataBtn.disabled = false;
            searchTransformationsBtn.disabled = false;
        }
    }

    async function clearAllData() {
        if (!window.confirm(
            'Permanently clear every SQLite table and the entire Neo4j projection?'
        )) return;
        transformationsContent.innerHTML = '<span class="text-muted">Clearing SQLite and Neo4j...</span>';
        clearAllDataBtn.disabled = true;
        try {
            const response = await fetch('/storage', { method: 'DELETE' });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Failed to clear application storage');
            fullReset();
            window.alert('All SQLite data and the Neo4j projection were cleared.');
        } catch (err) {
            transformationsContent.innerHTML = `<div class="alert alert-danger mb-0">Error: ${escapeHtml(err.message)}</div>`;
        } finally {
            clearAllDataBtn.disabled = false;
        }
    }

    function renderTransformationsTable(rows, total, limit) {
        if (!rows || !rows.length) {
            return '<p class="text-muted mb-0"><em>No transformations match the filter.</em></p>';
        }
        let html = '';
        if (total > limit) {
            html += `<div class="alert alert-info py-2 mb-2">Showing first ${limit} of ${total} rows. Use filter to narrow results.</div>`;
        }
        html += `<div class="table-responsive"><table class="table table-sm table-bordered transformations-table mb-0">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Target layer</th>
                    <th>Target table</th>
                    <th>Target field</th>
                    <th>Source layer</th>
                    <th>Source table</th>
                    <th>Source field</th>
                    <th>Transformation</th>
                </tr>
            </thead>
            <tbody>`;
        for (const row of rows) {
            const rulePreview = previewCellText(row.transformation_rule || '').slice(0, 500);
            html += `<tr>
                <td>${escapeHtml(previewCellText(row.row_num))}</td>
                <td>${escapeHtml(previewCellText(row.target_layer))}</td>
                <td title="${escapeAttr(previewCellText(row.target_table))}">${escapeHtml(previewCellText(row.target_table))}</td>
                <td title="${escapeAttr(previewCellText(row.target_field))}">${escapeHtml(previewCellText(row.target_field))}</td>
                <td>${escapeHtml(previewCellText(row.source_layer))}</td>
                <td title="${escapeAttr(previewCellText(row.source_table))}">${escapeHtml(previewCellText(row.source_table))}</td>
                <td title="${escapeAttr(previewCellText(row.source_field))}">${escapeHtml(previewCellText(row.source_field))}</td>
                <td class="transformations-sql" title="${escapeAttr(rulePreview)}">${escapeHtml(rulePreview)}</td>
            </tr>`;
        }
        html += '</tbody></table></div>';
        return html;
    }

    loadTransformationsBtn.addEventListener('click', loadTransformations);
    clearAllDataBtn.addEventListener('click', clearAllData);
    searchTransformationsBtn.addEventListener('click', loadTransformations);
    transformationsSearch.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') loadTransformations();
    });

    // Existing upload logic
    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const file = fileInput.files[0];
        if (!file) {
            errorMessage.textContent = 'Please select a file';
            errorArea.style.display = 'block';
            return;
        }

        resetUI();

        const formData = new FormData();
        formData.append('file', file);
        formData.append('include_hidden_rows', String(includeHiddenRows.checked));

        loadingDiv.classList.remove('d-none');

        try {
            const response = await fetch('/upload', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Unknown error');

            currentFileId = data.file_id;
            showSummary(data.summary, data.summary_error);
            showTransformationsPanel(data.s2t_transformations_count);
        } catch (err) {
            errorMessage.textContent = err.message;
            errorArea.style.display = 'block';
        } finally {
            loadingDiv.classList.add('d-none');
        }
    });

    function previewCellText(v) {
        if (v === null || v === undefined) return '';
        if (typeof v === 'object') return JSON.stringify(v);
        return String(v);
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function escapeAttr(str) {
        if (str == null || str === '') return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/"/g, '&quot;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
    }
</script>
</body>
</html>

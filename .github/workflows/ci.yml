name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GIGACHAT_API_KEY: test-only
      GIGACHAT_VERIFY_SSL: "0"
      LANGFUSE_PUBLIC_KEY: ""
      LANGFUSE_SECRET_KEY: ""
      OTEL_SDK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Sync locked dependencies
        run: uv sync --frozen
      - name: Compile application modules
        run: uv run python -m compileall -q app.py agents processing services storage graph_storage sheet_skills scripts
      - name: Verify ASGI application import
        run: uv run python -c "from app import app; assert app.title == 'ETL S2T Agent'"
      - name: Run tests with coverage
        run: >-
          uv run pytest tests/ -q
          --cov=.
          --cov-config=.coveragerc
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-report=html:htmlcov
      - name: Publish coverage summary
        if: ${{ always() && hashFiles('.coverage') != '' }}
        run: |
          echo "## Test coverage" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: warn
          retention-days: 14

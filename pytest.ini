[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Command line options
addopts =
    -v
    -p no:cacheprovider
    --strict-markers
    --tb=short
    --disable-warnings

# Markers (custom markers can be added here)
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks integration tests (requires external services)
    live_agent: runs the configured real LLM through the complete agent graph
    live_smoke: fast live checks for direct chat and a basic data request
    live_history: supervisor and conversational-history behavior
    live_display: full-result and scrollable-display behavior
    live_handoff: dependent worker and cross-step handoff behavior
    live_graph: Neo4j lineage and path behavior
    live_validation: S2T validation and protocol-generation behavior
    live_resolution: shared entity-resolution behavior in validation and agentic flows
    live_catalog: S2T catalog, semantic search, and impact-analysis behavior

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:.*pandas.*:
